<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Curso de Arduino para Docentes de Escuela Técnica (Ciclo Básico 1.º a 3.º año). Plataforma interactiva con seguimiento de progreso y planificaciones guardadas localmente." />
  <title>Arduino para Docentes de Escuela Técnica · Ciclo Básico</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <style>
/* =========================================================
   Curso de Arduino para Docentes
   Hoja de estilos — CSS3 puro (sin dependencias externas)
   ========================================================= */

/* ---------- Tokens / Tema ---------- */
:root {
  --arduino: #00979d;
  --arduino-dark: #007a7f;
  --arduino-soft: rgba(0, 151, 157, 0.12);

  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #eef1f6;
  --text: #16202b;
  --text-soft: #5a6a7a;
  --text-faint: #8797a7;
  --border: #dde4ec;
  --border-strong: #c6d0db;

  --success: #1f9d55;
  --success-soft: rgba(31, 157, 85, 0.14);
  --warn: #d9822b;
  --warn-soft: rgba(217, 130, 43, 0.14);
  --danger: #d64545;
  --danger-soft: rgba(214, 69, 69, 0.12);
  --info: #2f6fd0;
  --info-soft: rgba(47, 111, 208, 0.12);

  --radius: 14px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 2px rgba(16, 32, 48, .06), 0 1px 3px rgba(16, 32, 48, .05);
  --shadow-md: 0 6px 20px rgba(16, 32, 48, .08);
  --shadow-lg: 0 18px 48px rgba(16, 32, 48, .16);

  --sidebar-w: 332px;
  --topbar-h: 64px;
  --mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}

html[data-theme="dark"] {
  --bg: #0e1620;
  --surface: #16202c;
  --surface-2: #1b2734;
  --surface-3: #223040;
  --text: #e8eef5;
  --text-soft: #a6b6c7;
  --text-faint: #7c8da3;
  --border: #26333f;
  --border-strong: #33465a;
  --arduino-soft: rgba(0, 151, 157, 0.18);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, .4);
  --shadow-lg: 0 22px 56px rgba(0, 0, 0, .55);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}

h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0 0 1em; }
a { color: var(--arduino-dark); }
img { max-width: 100%; }
code { font-family: var(--mono); }

:focus-visible {
  outline: 3px solid var(--arduino);
  outline-offset: 2px;
  border-radius: 4px;
}

.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 1000;
  background: var(--arduino); color: #fff; padding: 10px 16px;
  border-radius: 0 0 8px 8px; text-decoration: none; font-weight: 600;
  transition: top .2s ease;
}
.skip-link:focus { top: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ---------- Botones ---------- */
.btn {
  --btn-bg: var(--surface);
  --btn-fg: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  font: inherit; font-weight: 600; cursor: pointer;
  padding: .68rem 1.15rem; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--btn-bg); color: var(--btn-fg);
  transition: transform .12s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0); }
.btn--primary { --btn-bg: var(--arduino); --btn-fg: #fff; border-color: var(--arduino); }
.btn--primary:hover { --btn-bg: var(--arduino-dark); }
.btn--success { --btn-bg: var(--success); --btn-fg: #fff; border-color: var(--success); }
.btn--ghost { --btn-bg: transparent; border-color: var(--border-strong); }
.btn--block { width: 100%; }
.btn--lg { padding: .85rem 1.4rem; font-size: 1.02rem; }
.btn--done { --btn-bg: var(--success-soft); --btn-fg: var(--success); border-color: var(--success); }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 42px; height: 42px; padding: 0;
  border-radius: 11px; border: 1px solid transparent;
  background: transparent; color: var(--text-soft); cursor: pointer;
  transition: background .18s, color .18s, border-color .18s, transform .12s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn--danger:hover { background: var(--danger-soft); color: var(--danger); }

/* ---------- Barra superior ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 0 1rem;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar__left, .topbar__right { display: flex; align-items: center; gap: .5rem; }
.brand { display: flex; align-items: center; gap: .65rem; }
.brand__logo {
  display: grid; place-items: center; width: 42px; height: 42px;
  border-radius: 12px; color: #fff;
  background: linear-gradient(135deg, var(--arduino), #00c2c9);
  box-shadow: var(--shadow-sm);
}
.brand__text { display: flex; flex-direction: column; line-height: 1.15; }
.brand__text strong { font-size: 1.02rem; }
.brand__text small { color: var(--text-faint); font-size: .78rem; }

.topbar-progress { position: relative; display: grid; place-items: center; margin-right: .25rem; }
.ring { transform: rotate(-90deg); }
.ring__bg { fill: none; stroke: var(--border); stroke-width: 4; }
.ring__value {
  fill: none; stroke: var(--arduino); stroke-width: 4; stroke-linecap: round;
  stroke-dasharray: 100.53; stroke-dashoffset: 100.53;
  transition: stroke-dashoffset .6s cubic-bezier(.22,.61,.36,1);
}
.topbar-progress__text {
  position: absolute; font-size: .68rem; font-weight: 700; color: var(--text-soft);
}
.icon-moon { display: none; }
html[data-theme="dark"] .icon-sun { display: none; }
html[data-theme="dark"] .icon-moon { display: block; }

/* ---------- Layout ---------- */
.layout { display: flex; align-items: flex-start; min-height: calc(100vh - var(--topbar-h)); }

.sidebar {
  flex: 0 0 var(--sidebar-w); width: var(--sidebar-w);
  height: calc(100vh - var(--topbar-h));
  position: sticky; top: var(--topbar-h);
  border-right: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  transition: flex-basis .3s ease, width .3s ease, opacity .25s ease;
}
.sidebar__inner { height: 100%; overflow-y: auto; padding: 1rem 1rem 3rem; }

body.sidebar-collapsed .sidebar { flex-basis: 0; width: 0; opacity: 0; pointer-events: none; }

/* ---------- Tarjeta de progreso ---------- */
.progress-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  margin-bottom: 1rem;
}
.progress-card__head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.progress-card__head h2 { font-size: .95rem; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); }
.badge {
  background: var(--arduino-soft); color: var(--arduino-dark);
  font-weight: 700; font-size: .82rem; padding: .2rem .6rem; border-radius: 999px;
}
html[data-theme="dark"] .badge { color: #4fd6dc; }
.progress-bar {
  height: 9px; border-radius: 999px; background: var(--surface-3);
  overflow: hidden; margin: .8rem 0 .6rem;
}
.progress-bar__fill {
  display: block; height: 100%; width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--arduino), #22c3b8);
  transition: width .6s cubic-bezier(.22,.61,.36,1);
}
.progress-card__meta { font-size: .82rem; color: var(--text-soft); margin: 0 0 .85rem; }
.progress-card__meta strong { color: var(--text); }

/* ---------- Árbol del curso ---------- */
.course-tree { display: flex; flex-direction: column; gap: .35rem; }
.module { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.module__head {
  display: flex; align-items: center; gap: .6rem; width: 100%;
  padding: .8rem .85rem; border: 0; cursor: pointer; text-align: left;
  background: var(--surface); color: var(--text); font: inherit;
  transition: background .18s;
}
.module__head:hover { background: var(--surface-2); }
.module__index {
  flex: none; width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center; font-size: .8rem; font-weight: 700;
  background: var(--arduino-soft); color: var(--arduino-dark);
}
html[data-theme="dark"] .module__index { color: #4fd6dc; }
.module__titles { flex: 1; min-width: 0; }
.module__title { display: block; font-size: .9rem; font-weight: 600; }
.module__sub { display: block; font-size: .74rem; color: var(--text-faint); }
.module__chevron { flex: none; color: var(--text-faint); transition: transform .25s ease; }
.module[data-open="false"] .module__chevron { transform: rotate(-90deg); }
.module__body {
  display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s ease;
}
.module[data-open="false"] .module__body { grid-template-rows: 0fr; }
.module__lessons { overflow: hidden; list-style: none; margin: 0; padding: 0 .5rem .5rem; }
.module__lessons li { margin: 0; }

.lesson-link {
  display: flex; align-items: center; gap: .6rem; width: 100%;
  padding: .55rem .6rem; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent;
  color: var(--text-soft); font: inherit; font-size: .86rem; text-align: left; cursor: pointer;
  transition: background .16s, color .16s, border-color .16s;
}
.lesson-link:hover { background: var(--surface-2); color: var(--text); }
.lesson-link.is-active { background: var(--arduino-soft); color: var(--text); border-color: color-mix(in srgb, var(--arduino) 45%, transparent); font-weight: 600; }
.lesson-link__status {
  flex: none; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; border: 2px solid var(--border-strong);
  color: transparent; font-size: 12px;
}
.lesson-link.is-done .lesson-link__status { background: var(--success); border-color: var(--success); color: #fff; }
.lesson-link.is-current .lesson-link__status { border-color: var(--warn); }
.lesson-link.is-current .lesson-link__status::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.lesson-link__num { color: var(--text-faint); font-variant-numeric: tabular-nums; font-size: .78rem; }
.lesson-link__label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-link__check { display: none; }
.lesson-link.is-done .lesson-link__check { display: block; }
.lesson-link.is-done .lesson-link__status::after { display: none; }

/* ---------- Contenido ---------- */
.content { flex: 1; min-width: 0; padding: 2rem clamp(1rem, 4vw, 3rem) 5rem; }
.lesson { max-width: 860px; margin: 0 auto; animation: fadeUp .35s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.lesson__breadcrumb { font-size: .82rem; color: var(--text-faint); margin-bottom: .6rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.lesson__breadcrumb span { color: var(--border-strong); }
.lesson__eyebrow { color: var(--arduino-dark); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
html[data-theme="dark"] .lesson__eyebrow { color: #4fd6dc; }
.lesson__title { font-size: clamp(1.55rem, 3.4vw, 2.15rem); margin: .15rem 0 .8rem; }
.lesson__meta { display: flex; flex-wrap: wrap; gap: .5rem 1rem; color: var(--text-soft); font-size: .86rem; margin-bottom: 1.4rem; }
.lesson__meta .chip { display: inline-flex; align-items: center; gap: .4rem; background: var(--surface); border: 1px solid var(--border); padding: .3rem .7rem; border-radius: 999px; }
.lesson__status-chip.is-done { background: var(--success-soft); border-color: var(--success); color: var(--success); font-weight: 600; }

.lesson__body { font-size: 1.02rem; }
.lesson__body h3 { font-size: 1.28rem; margin: 1.8rem 0 .6rem; }
.lesson__body h4 { font-size: 1.06rem; margin: 1.4rem 0 .5rem; }
.lesson__body ul, .lesson__body ol { padding-left: 1.3rem; margin: 0 0 1.1rem; }
.lesson__body li { margin-bottom: .4rem; }
.lesson__body strong { color: var(--text); }

/* Bloques especiales */
.callout {
  display: flex; gap: .8rem; padding: 1rem 1.1rem; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface-2);
  border-left: 4px solid var(--info); margin: 1.3rem 0;
}
.callout__icon { flex: none; width: 22px; height: 22px; color: var(--info); }
.callout__title { font-weight: 700; display: block; margin-bottom: .15rem; }
.callout p:last-child { margin-bottom: 0; }
.callout--tip { border-left-color: var(--success); }
.callout--tip .callout__icon { color: var(--success); }
.callout--tip { background: var(--success-soft); }
.callout--warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout--warn .callout__icon { color: var(--warn); }
.callout--info { background: var(--info-soft); }

/* Tablas */
.table-wrap { overflow-x: auto; margin: 1.2rem 0; border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
thead th {
  background: var(--surface-3); text-align: left; padding: .7rem .9rem;
  font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-soft);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody td { padding: .65rem .9rem; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:nth-child(even) { background: var(--surface-2); }

/* Bloques de código */
.code-block {
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; margin: 1.3rem 0; background: #0d1b26;
  box-shadow: var(--shadow-sm);
}
.code-block__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: .75rem; padding: .5rem .75rem .5rem 1rem;
  background: #0a1621; border-bottom: 1px solid #1d2f3d;
}
.code-block__file { display: flex; align-items: center; gap: .5rem; color: #8fb3c7; font-family: var(--mono); font-size: .8rem; }
.code-block__dots { display: inline-flex; gap: .3rem; margin-right: .35rem; }
.code-block__dots i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.code-block__dots i:nth-child(1) { background: #ff5f57; }
.code-block__dots i:nth-child(2) { background: #febc2e; }
.code-block__dots i:nth-child(3) { background: #28c840; }
.code-block__copy {
  display: inline-flex; align-items: center; gap: .4rem; cursor: pointer;
  background: #16283a; color: #cfe6f3; border: 1px solid #24455c;
  font: inherit; font-size: .78rem; font-weight: 600; padding: .35rem .7rem; border-radius: 7px;
  transition: background .18s, color .18s, border-color .18s;
}
.code-block__copy:hover { background: #1d3b52; }
.code-block__copy.is-copied { background: var(--success); border-color: var(--success); color: #fff; }
.code-block pre { margin: 0; padding: 1rem 1.1rem; overflow-x: auto; }
.code-block code { font-size: .855rem; line-height: 1.6; color: #d5e5f0; white-space: pre; }
.tok-com { color: #6b8ba0; font-style: italic; }
.tok-str { color: #f0b37e; }
.tok-num { color: #d9a3ff; }
.tok-kw { color: #57c7ff; font-weight: 600; }
.tok-pre { color: #7ee0c9; }
.tok-fn { color: #ffd479; }

/* Apuntes del docente */
.notes {
  margin-top: 2.2rem; padding: 1.2rem; border-radius: var(--radius);
  border: 1px dashed var(--border-strong); background: var(--surface-2);
}
.notes__head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .6rem; flex-wrap: wrap; }
.notes__head h3 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: .5rem; }
.notes__hint { font-size: .78rem; color: var(--text-faint); }
.notes textarea {
  width: 100%; min-height: 140px; resize: vertical;
  font: inherit; font-size: .95rem; line-height: 1.6; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: .85rem .95rem; transition: border-color .2s, box-shadow .2s;
}
.notes textarea:focus { border-color: var(--arduino); box-shadow: 0 0 0 3px var(--arduino-soft); outline: none; }
.notes__status { font-size: .78rem; color: var(--text-faint); margin: .5rem 0 0; display: flex; align-items: center; gap: .4rem; min-height: 1.1em; }
.notes__status.is-saved { color: var(--success); }

/* Pie de lección / acciones */
.lesson__actions {
  position: sticky; bottom: 0; z-index: 20;
  margin-top: 2rem; padding: 1rem 0;
  display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: space-between;
  background: linear-gradient(to top, var(--bg) 65%, transparent);
}
.lesson__nav { display: flex; gap: .6rem; }

/* Pantalla de inicio */
.hero { max-width: 900px; margin: 0 auto; }
.hero__panel {
  border-radius: 22px; padding: clamp(1.5rem, 4vw, 3rem); color: #eafcff;
  background: radial-gradient(120% 140% at 0% 0%, #00979d 0%, #01474d 55%, #062b33 100%);
  box-shadow: var(--shadow-lg); margin-bottom: 2rem;
}
.hero__panel h1 { font-size: clamp(1.8rem, 4vw, 2.7rem); margin-bottom: .6rem; }
.hero__panel p { color: #c3e9ec; max-width: 60ch; }
.hero__actions { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: 1.4rem; }
.hero__actions .btn--ghost { --btn-fg: #eafcff; border-color: rgba(255,255,255,.4); }
.hero__actions .btn--primary { --btn-bg: #fff; --btn-fg: #01474d; border-color: #fff; }
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
.feature {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.2rem; box-shadow: var(--shadow-sm);
}
.feature__icon {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; margin-bottom: .7rem;
  background: var(--arduino-soft); color: var(--arduino-dark);
}
html[data-theme="dark"] .feature__icon { color: #4fd6dc; }
.feature h3 { font-size: 1rem; margin-bottom: .3rem; }
.feature p { font-size: .9rem; color: var(--text-soft); margin: 0; }

/* ---------- Overlay + toasts ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(8, 16, 24, .5); backdrop-filter: blur(2px);
  opacity: 0; transition: opacity .25s ease;
}
.overlay.is-visible { opacity: 1; }

.toast-region {
  position: fixed; z-index: 200; right: 1rem; bottom: 1rem;
  display: flex; flex-direction: column; gap: .6rem; max-width: min(92vw, 380px);
}
.toast {
  display: flex; align-items: center; gap: .6rem;
  padding: .75rem 1rem; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-md); color: var(--text); font-size: .9rem;
  animation: toastIn .28s ease both;
}
.toast--ok { border-left: 4px solid var(--success); }
.toast--info { border-left: 4px solid var(--info); }
.toast--warn { border-left: 4px solid var(--warn); }
.toast.is-leaving { animation: toastOut .25s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .sidebar {
    position: fixed; top: var(--topbar-h); left: 0; z-index: 58;
    height: calc(100vh - var(--topbar-h));
    transform: translateX(-100%); opacity: 1;
    box-shadow: var(--shadow-lg);
    transition: transform .3s ease;
  }
  body.sidebar-open .sidebar { transform: translateX(0); }
  .content { padding: 1.4rem 1rem 4rem; }
  .brand__text small { display: none; }
}
@media (max-width: 560px) {
  :root { --topbar-h: 58px; }
  .brand__logo { width: 36px; height: 36px; }
  .brand__text strong { font-size: .92rem; }
  .topbar-progress { display: none; }
  .lesson__actions { justify-content: stretch; }
  .lesson__actions .btn { flex: 1; }
  .lesson__nav { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {

            { type: 'code', file: 'Ultrasonico.ino', code: `const int TRIG = 9;

  pinMode(TRIG, OUTPUT);
  pinMode(ECHO, INPUT);
  Serial.begin(9600);
}

void loop() {
  // Emitir un pulso de 10 microsegundos
  digitalWrite(TRIG, LOW);
  delayMicroseconds(2);
  digitalWrite(TRIG, HIGH);
  delayMicroseconds(10);
  digitalWrite(TRIG, LOW);

  // Medir el tiempo de eco (ida y vuelta)
  long duracion = pulseIn(ECHO, HIGH);
  long distanciaCm = duracion * 0.034 / 2;   // velocidad del sonido

  Serial.println(" cm");
  delay(300);
}` },

            { type: 'code', file: 'Motor_DC.ino', code: `const int ENA = 9;   // Velocidad (PWM)
const int IN1 = 8;   // Sentido
const int IN2 = 7;   // Sentido

void setup() {
  pinMode(ENA, OUTPUT);
  pinMode(IN1, OUTPUT);
  pinMode(IN2, OUTPUT);
}

void adelante(int v) {
  digitalWrite(IN1, HIGH); digitalWrite(IN2, LOW);
  analogWrite(ENA, v);
}
void atras(int v) {
  digitalWrite(IN1, LOW);  digitalWrite(IN2, HIGH);
  analogWrite(ENA, v);
}
void detener() {
  digitalWrite(IN1, LOW);  digitalWrite(IN2, LOW);
  analogWrite(ENA, 0);
}

void loop() {
  adelante(200); delay(2000);
  detener();     delay(500);
  atras(200);    delay(2000);
  detener();     delay(1000);
}` },

            { type: 'code', file: 'Bucle_Control.ino', code: `const int LED_ROJO  = 8;
const int LED_VERDE = 9;
const int PULSADOR  = 2;

int estado = 0;
unsigned long anterior = 0;
const unsigned long INTERVALO = 2000;

void aplicar() {
  digitalWrite(LED_ROJO,  estado == 0);
  digitalWrite(LED_VERDE, estado == 1);
}

void setup() {
  pinMode(LED_ROJO, OUTPUT); pinMode(LED_VERDE, OUTPUT);
  pinMode(PULSADOR, INPUT_PULLUP);
}

void loop() {
  unsigned long ahora = millis();
  if (ahora - anterior >= INTERVALO) {   // No bloquea el programa
    anterior = ahora;
    estado = !estado;
    aplicar();
  }
  if (digitalRead(PULSADOR) == LOW) {
    estado = !estado;
    aplicar();
    delay(250);   // Anti-rebote
  }
}` },

            { type: 'code', file: 'Porton_Automatico.ino', code: `#include <Servo.h>

Servo porton;
const int PIN_SERVO  = 9;
const int FIN_ABIERTO = 2;   // Final de carrera superior
const int FIN_CERRADO = 3;   // Final de carrera inferior
const int PULSADOR    = 4;   // Orden del operario

bool abierto = false;

void setup() {
  porton.attach(PIN_SERVO);
  pinMode(FIN_ABIERTO, INPUT_PULLUP);
  pinMode(FIN_CERRADO, INPUT_PULLUP);
  pinMode(PULSADOR, INPUT_PULLUP);
  porton.write(0);   // Comienza cerrado
}

void loop() {
  if (digitalRead(PULSADOR) == LOW) {   // Orden de accionar
    delay(300);                          // Anti-rebote
    if (!abierto) {
      while (digitalRead(FIN_ABIERTO) == HIGH) {
        porton.write(porton.read() + 1);   // Abre gradualmente
        delay(15);
      }
      abierto = true;
    } else {
      while (digitalRead(FIN_CERRADO) == HIGH) {
        porton.write(porton.read() - 1);   // Cierra gradualmente
        delay(15);
      }
      abierto = false;
    }
  }
}` },

/* ---------------------------------------------------------
   2) ESTADO Y PERSISTENCIA (localStorage)
   --------------------------------------------------------- */
const STORAGE_KEY = 'curso-arduino-etp:v1';
const STATUS = { PENDIENTE: 'pendiente', CURSO: 'en-curso', COMPLETADA: 'completada' };

const defaultState = () => ({
  status: {},           // { '1.1': 'completada' }
  notes: {},            // apuntes personales por lección
  plans: {},            // planificaciones del docente por lección
  theme: 'light',
  lastLesson: null,
  collapsedModules: [],
  yearFilter: 'all'
});

let state = defaultState();

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...defaultState(), ...parsed };
      state.status = parsed.status || {};
      state.notes = parsed.notes || {};
      state.plans = parsed.plans || {};
      state.collapsedModules = parsed.collapsedModules || [];
    }
  } catch (err) {
    console.warn('No se pudo leer el progreso guardado.', err);
    state = defaultState();
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.warn('No se pudo guardar el progreso.', err);
    toast('No se pudo guardar en este navegador.', 'warn');
  }
}

/* ---------------------------------------------------------
   3) UTILIDADES
   --------------------------------------------------------- */
const ALL_LESSONS = COURSE.modules.flatMap(m =>
  m.lessons.map(l => ({ ...l, moduleId: m.id, moduleNum: m.num, moduleTitle: m.title, moduleYear: m.year }))
);
const TOTAL_LESSONS = ALL_LESSONS.length;
const YEARS = [...new Set(COURSE.modules.map(m => m.year))].sort();

const getLesson = id => ALL_LESSONS.find(l => l.id === id);
const getModule = id => COURSE.modules.find(m => m.id === id);
const lessonStatus = id => state.status[id] || STATUS.PENDIENTE;

const completedLessons = () => ALL_LESSONS.filter(l => lessonStatus(l.id) === STATUS.COMPLETADA);
function progressPercent() {
  const done = completedLessons().length;
  return TOTAL_LESSONS === 0 ? 0 : Math.round((done / TOTAL_LESSONS) * 100);
}
function moduleStats(mod) {
  const done = mod.lessons.filter(l => lessonStatus(l.id) === STATUS.COMPLETADA).length;
  return { done, total: mod.lessons.length };
}
function yearStats(year) {
  const les = ALL_LESSONS.filter(l => l.moduleYear === year);
  return { done: les.filter(l => lessonStatus(l.id) === STATUS.COMPLETADA).length, total: les.length };
}
function firstPendingLesson() {
  const pool = state.yearFilter === 'all'
    ? ALL_LESSONS
    : ALL_LESSONS.filter(l => l.moduleYear === Number(state.yearFilter));
  return (pool.find(l => lessonStatus(l.id) !== STATUS.COMPLETADA) || pool[0] || ALL_LESSONS[0]);
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightCode(code) {
  const esc = escapeHtml(code);
  const pattern = new RegExp([
    '(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)',
    '("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')',
    '(\\b(?:0x[0-9A-Fa-f]+|\\d+\\.?\\d*)\\b)',
    '(\\b(?:void|int|long|float|double|char|bool|boolean|byte|word|unsigned|const|static|if|else|for|while|do|switch|case|break|continue|return|true|false|HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|String|Serial|Servo|LiquidCrystal|LiquidCrystal_I2C|DHT|setup|loop|pinMode|digitalWrite|digitalRead|analogWrite|analogRead|delay|delayMicroseconds|pulseIn|millis|micros|map|constrain|isnan|tone|noTone|random|randomSeed|attach|detach|write|read|print|println|begin|available|setCursor|createChar|init|backlight)\\b)',
    '([A-Za-z_]\\w*)(?=\\s*\\()',
    '(^[ \\t]*#\\w+)'
  ].join('|'), 'gm');

  return esc.replace(pattern, (m, com, str, num, kw, fn, pre) => {
    if (com) return `<span class="tok-com">${m}</span>`;
    if (str) return `<span class="tok-str">${m}</span>`;
    if (num) return `<span class="tok-num">${m}</span>`;
    if (kw)  return `<span class="tok-kw">${m}</span>`;
    if (fn)  return `<span class="tok-fn">${m}</span>`;
    if (pre) return `<span class="tok-pre">${m}</span>`;
    return m;
  });
}

/* ---------------------------------------------------------
   4) RENDER DE BLOQUES DE CONTENIDO
   --------------------------------------------------------- */
function renderBlock(block, idx) {
  switch (block.type) {
    case 'p':  return `<p>${block.html}</p>`;
    case 'h3': return `<h3>${block.html}</h3>`;
    case 'h4': return `<h4>${block.html}</h4>`;
    case 'ul': return `<ul>${block.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
    case 'ol': return `<ol>${block.items.map(i => `<li>${i}</li>`).join('')}</ol>`;
    case 'table':
      return `<div class="table-wrap"><table>
        <thead><tr>${block.headers.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead>
        <tbody>${block.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
    case 'callout': {
      const icons = {
        info: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="8" r="1.1" fill="currentColor"/>',
        tip: '<path d="M10 3h4M12 3v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 21h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 6a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6h5.4c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
        warn: '<path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="18" r="1.1" fill="currentColor"/>'
      };
      return `<div class="callout callout--${block.variant}">
        <span class="callout__icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">${icons[block.variant] || icons.info}</svg></span>
        <div class="callout__body">
          ${block.title ? `<strong class="callout__title">${block.title}</strong>` : ''}
          <div>${block.html}</div>
        </div>
      </div>`;
    }
    case 'code':
      return `<figure class="code-block">
        <figcaption class="code-block__head">
          <span class="code-block__file"><span class="code-block__dots"><i></i><i></i><i></i></span>${block.file}</span>
          <button class="code-block__copy" type="button" data-copy="code-${idx}" aria-label="Copiar el código de ${block.file}">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V6a2 2 0 0 1 2-2h9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            Copiar código
          </button>
        </figcaption>
        <pre id="code-${idx}" tabindex="0"><code>${highlightCode(block.code)}</code></pre>
      </figure>`;
    default: return '';
  }
}

            Planificación de la clase
          </div>
          <label class="sr-only" for="planField">Planificación de la lección ${lesson.id}</label>
          <textarea id="planField" data-field="plan" data-lesson="${lesson.id}" placeholder="Objetivos de la clase, inicio - desarrollo - cierre, tiempos, agrupamientos, articulación con otros talleres…">${escapeHtml(state.plans[id] || '')}</textarea>
          <p class="field__hint" id="hint-plan" aria-live="polite"></p>
        </div>

        <div class="field">
          <div class="section-label">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Apuntes y observaciones
          </div>
          <label class="sr-only" for="notesField">Apuntes de la lección ${lesson.id}</label>
          <textarea id="notesField" data-field="notes" data-lesson="${lesson.id}" placeholder="Dudas del grupo, ajustes de montaje, resultados de la experiencia, ideas para mejorar la próxima clase…">${escapeHtml(state.notes[id] || '')}</textarea>
          <p class="field__hint" id="hint-notes" aria-live="polite"></p>
        </div>
      </section>

      <div class="lesson__actions">
        <div class="lesson__nav">
          <button class="btn btn--ghost" type="button" ${prev ? `data-lesson="${prev.id}"` : 'disabled'}>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Anterior
          </button>
          <button class="btn btn--ghost" type="button" ${next ? `data-lesson="${next.id}"` : 'disabled'}>
            Siguiente
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button id="completeBtn" class="btn btn--lg ${isDone ? 'btn--done' : 'btn--success'}" type="button" data-lesson="${lesson.id}">
          ${isDone ? '✓ Lección completada (desmarcar)' : 'Marcar como completada'}
        </button>
      </div>
    </article>`;

  setActiveLesson(id);
  updateProgressUI();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function setActiveLesson(id) {
  els.moduleList.querySelectorAll('.lesson-link').forEach(btn => {
    const active = btn.dataset.lesson === id;
    btn.classList.toggle('is-active', active);
    btn.setAttribute('aria-current', active ? 'true' : 'false');
  });
}

function updateProgressUI() {
  const pct = progressPercent();
  const done = completedLessons().length;

  els.progressFill.style.width = pct + '%';
  els.progressPercent.textContent = pct + '%';
  els.doneCount.textContent = done;
  els.totalCount.textContent = TOTAL_LESSONS;
  els.progressBar.setAttribute('aria-valuenow', String(pct));

  els.ringValue.style.strokeDashoffset = String(RING_CIRC * (1 - pct / 100));
  els.ringText.textContent = pct + '%';

  els.yearProgress.innerHTML = YEARS.map(y => {
    const s = yearStats(y);
    const p = s.total ? Math.round((s.done / s.total) * 100) : 0;
    return `<div class="year-progress__row">
      <b>${y}.º</b>
      <span class="year-progress__bar"><i style="width:${p}%"></i></span>
      <span>${s.done}/${s.total}</span>
    </div>`;
  }).join('');

  els.yearButtons.forEach(btn => {
    const active = btn.dataset.year === String(state.yearFilter);
    btn.classList.toggle('is-active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });

  const next = firstPendingLesson();
  if (done === 0) els.continueText.textContent = 'Comenzar el curso';
  else if (done === TOTAL_LESSONS) els.continueText.textContent = '¡Curso completado! Repasar';
  else els.continueText.textContent = `Continuar: ${next.id}`;
}

/* ---------------------------------------------------------
   6) NAVEGACIÓN
   --------------------------------------------------------- */
function goTo(id) {
  if (!getLesson(id)) return;
  window.location.hash = '#leccion=' + encodeURIComponent(id);
  closeMobileSidebar();
}

function route() {
  const match = (window.location.hash || '').match(/leccion=([^&]+)/);
  const id = match ? decodeURIComponent(match[1]) : null;

  if (id && getLesson(id)) {
    if (lessonStatus(id) === STATUS.PENDIENTE) {
      state.status[id] = STATUS.CURSO;
    }
    state.lastLesson = id;
    saveProgress();
    renderLesson(id);
    renderSidebar();
  } else {
    renderHero();
    renderSidebar();
  }
}

/* ---------------------------------------------------------
   7) ACCIONES
   --------------------------------------------------------- */
function toggleComplete(id) {
  if (!getLesson(id)) return;
  if (lessonStatus(id) === STATUS.COMPLETADA) {
    state.status[id] = STATUS.CURSO;
    toast('Lección marcada como en curso.', 'info');
  } else {
    state.status[id] = STATUS.COMPLETADA;
    toast('¡Lección completada! Buen trabajo.', 'ok');
  }
  saveProgress();
  renderSidebar();
  renderLesson(id);
}

function resetProgress() {
  const ok = window.confirm(
    '¿Seguro que quieres reiniciar TODO tu progreso?\n\n' +
    'Se borrarán las lecciones completadas, tus apuntes y todas las planificaciones.\n\n' +
    'Esta acción no se puede deshacer.'
  );
  if (!ok) return;

  const theme = state.theme;
  state = { ...defaultState(), theme };
  saveProgress();
  closeMobileSidebar();
  window.location.hash = '';
  renderSidebar();
  renderHero();
  toast('Progreso reiniciado. Puedes empezar de nuevo.', 'warn');
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveProgress();
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
}

function toggleModule(modId) {
  const i = state.collapsedModules.indexOf(modId);
  if (i === -1) state.collapsedModules.push(modId);
  else state.collapsedModules.splice(i, 1);
  saveProgress();

  const section = els.moduleList.querySelector(`.module[data-module="${modId}"]`);
  if (section) {
    const open = !state.collapsedModules.includes(modId);
    section.dataset.open = String(open);
    section.querySelector('.module__head').setAttribute('aria-expanded', String(open));
  }
}

function setYearFilter(year) {
  state.yearFilter = year;
  saveProgress();
  renderSidebar();
  updateProgressUI();
}

async function copyCode(btn, codeId) {
  const pre = document.getElementById(codeId);
  if (!pre) return;
  const text = pre.innerText;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    const original = btn.innerHTML;
    btn.classList.add('is-copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 12.5l5 5 11-11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg> ¡Copiado!';
    toast('Código copiado al portapapeles.', 'ok');
    setTimeout(() => { btn.innerHTML = original; btn.classList.remove('is-copied'); }, 2000);
  } catch (err) {
    toast('No se pudo copiar. Selecciona el código manualmente.', 'warn');
  }
}

function toast(message, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.setAttribute('role', 'status');
  el.textContent = message;
  els.toastRegion.appendChild(el);
  setTimeout(() => {
    el.classList.add('is-leaving');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }, 2600);
}

/* Sidebar responsive */
const isMobile = () => window.matchMedia('(max-width: 980px)').matches;
function openMobileSidebar() {
  document.body.classList.add('sidebar-open');
  els.overlay.hidden = false;
  requestAnimationFrame(() => els.overlay.classList.add('is-visible'));
  els.menuToggle.setAttribute('aria-expanded', 'true');
}
function closeMobileSidebar() {
  if (!document.body.classList.contains('sidebar-open')) return;
  document.body.classList.remove('sidebar-open');
  els.overlay.classList.remove('is-visible');
  setTimeout(() => { els.overlay.hidden = true; }, 250);
  els.menuToggle.setAttribute('aria-expanded', 'false');
}
function toggleSidebar() {
  if (isMobile()) {
    document.body.classList.contains('sidebar-open') ? closeMobileSidebar() : openMobileSidebar();
  } else {
    const collapsed = document.body.classList.toggle('sidebar-collapsed');
    els.menuToggle.setAttribute('aria-expanded', String(!collapsed));
  }
}

/* ---------------------------------------------------------
   8) EVENTOS
   --------------------------------------------------------- */
function saveField(field, lessonId, value) {
  if (field === 'plan') state.plans[lessonId] = value;
  else state.notes[lessonId] = value;
  saveProgress();
  const hint = document.getElementById('hint-' + field);
  if (hint) { hint.classList.add('is-saved'); hint.textContent = '✓ Guardado'; }
}

function bindEvents() {
  document.addEventListener('click', (e) => {
    const copyBtn = e.target.closest('.code-block__copy');
    if (copyBtn) { copyCode(copyBtn, copyBtn.dataset.copy); return; }

    const moduleToggle = e.target.closest('[data-module-toggle]');
    if (moduleToggle) { toggleModule(moduleToggle.dataset.moduleToggle); return; }

    const yearBtn = e.target.closest('.year-filter__btn');
    if (yearBtn) { setYearFilter(yearBtn.dataset.year); return; }

    const lessonBtn = e.target.closest('[data-lesson]');
    if (lessonBtn && !lessonBtn.disabled) {
      if (lessonBtn.id === 'completeBtn') toggleComplete(lessonBtn.dataset.lesson);
      else goTo(lessonBtn.dataset.lesson);
      return;
    }

    const actionBtn = e.target.closest('[data-action="continue"]');
    if (actionBtn) { goTo(firstPendingLesson().id); return; }
  });

  els.continueBtn.addEventListener('click', () => goTo(firstPendingLesson().id));
  els.resetBtn.addEventListener('click', resetProgress);
  els.themeToggle.addEventListener('click', toggleTheme);
  els.menuToggle.addEventListener('click', toggleSidebar);
  els.overlay.addEventListener('click', closeMobileSidebar);

  window.addEventListener('hashchange', route);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMobileSidebar(); });
  window.addEventListener('resize', () => { if (!isMobile()) closeMobileSidebar(); });

  // Autoguardado de apuntes y planificaciones
  let timer = null;
  document.addEventListener('input', (e) => {
    const ta = e.target;
    if (!ta.matches('textarea[data-field]')) return;
    const field = ta.dataset.field;
    const id = ta.dataset.lesson;
    const hint = document.getElementById('hint-' + field);
    if (hint) { hint.classList.remove('is-saved'); hint.textContent = 'Escribiendo…'; }
    clearTimeout(timer);
    timer = setTimeout(() => saveField(field, id, ta.value), 500);
  });
  document.addEventListener('blur', (e) => {
    const ta = e.target;
    if (!ta.matches('textarea[data-field]')) return;
    saveField(ta.dataset.field, ta.dataset.lesson, ta.value);
  }, true);
}

/* ---------------------------------------------------------
   9) INICIALIZACIÓN
   --------------------------------------------------------- */
function init() {
  loadProgress();
  applyTheme();
  renderSidebar();
  bindEvents();
  updateProgressUI();

  if (isMobile()) els.menuToggle.setAttribute('aria-expanded', 'false');

  route();
}

document.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
